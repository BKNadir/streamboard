name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # `pack` validates the plugin before packaging it.
      - name: Pack plugin
        id: pack
        run: |
          mkdir -p dist
          npx streamdeck pack ./com.bknadir.streamboard.sdPlugin --output ./dist --force --no-update-check
          REF="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          echo "name=streamboard-${REF//\//-}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Download it from the run's "Artifacts" section, unzip it and
      # double-click the .streamDeckPlugin file to install it.
      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.name }}
          path: dist/*.streamDeckPlugin
          if-no-files-found: error
          retention-days: 14
