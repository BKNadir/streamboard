name: Release plugin

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check tag format
        run: |
          # Stream Deck only accepts numeric versions: v1.2.3 or v1.2.3.4
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a valid version. Use v<major>.<minor>.<patch> or v<major>.<minor>.<patch>.<build> (e.g. v0.3.0)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Pack plugin
        run: |
          mkdir -p dist
          npx streamdeck pack ./com.bknadir.streamboard.sdPlugin \
            --output ./dist \
            --force \
            --version "${GITHUB_REF_NAME#v}" \
            --no-update-check

      - name: Create source zip
        run: |
          zip -r ./dist/streamboard-${GITHUB_REF_NAME}.zip . \
            -x ".git/*" ".github/*" "node_modules/*" "*/node_modules/*" "dist/*" "*.sdPlugin/logs/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ./dist/*.streamDeckPlugin
            ./dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
