<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Play Sound</title>
	<script src="sdpi-components.js"></script>
</head>

<body>
	<sdpi-item label="Source Type">
		<sdpi-radio setting="sourceType" columns="2" default="file">
			<option value="file">Local file</option>
			<option value="url">URL</option>
		</sdpi-radio>
	</sdpi-item>

	<sdpi-item id="fileItem" label="File">
		<sdpi-file setting="sourceFile" accept="audio/*" placeholder="Select an audio file">
		</sdpi-file>
	</sdpi-item>

	<sdpi-item id="urlItem" label="URL" style="display: none">
		<sdpi-textfield setting="sourceUrl" placeholder="https://example.com/audio.mp3">
		</sdpi-textfield>
	</sdpi-item>

	<sdpi-item label="Action">
		<sdpi-select setting="mode" default="play_stop">
			<option value="play_stop">Play / Stop</option>
			<option value="play_overlap">Play / Overlap</option>
			<option value="play_restart">Play / Restart</option>
			<option value="loop_stop">Loop / Stop</option>
		</sdpi-select>
	</sdpi-item>

	<sdpi-item label="">
		<small id="modeHint"></small>
	</sdpi-item>

	<sdpi-item label="Volume">
		<sdpi-range setting="volume" min="0" max="100" step="5" default="100" showlabels>
			<span slot="min">0</span>
			<span slot="max">100</span>
		</sdpi-range>
	</sdpi-item>

	<sdpi-item label="Output">
		<sdpi-select setting="outputTarget" global default="default" datasource="getAudioDevices" show-refresh>
			<option value="default">System Default</option>
		</sdpi-select>
	</sdpi-item>

	<sdpi-item label="">
		<small>Shared by all StreamBoard keys: changing it here changes it everywhere.</small>
	</sdpi-item>

	<script>
		const { streamDeckClient } = SDPIComponents;

		const MODE_HINTS = {
			play_stop: "Press to play, press again to stop.",
			play_overlap: "Each press starts a new copy of the sound on top of the others.",
			play_restart: "Each press restarts the sound from the beginning.",
			loop_stop: "Press to loop the sound, press again to stop.",
		};

		function applySourceVisibility(sourceType) {
			const isUrl = sourceType === "url";
			document.getElementById("fileItem").style.display = isUrl ? "none" : "";
			document.getElementById("urlItem").style.display = isUrl ? "" : "none";
		}

		function applyModeHint(mode) {
			document.getElementById("modeHint").textContent = MODE_HINTS[mode] || MODE_HINTS.play_stop;
		}

		document.querySelector("sdpi-radio[setting='sourceType']")?.addEventListener("valuechange", (event) => {
			applySourceVisibility(event.target.value || "file");
		});

		document.querySelector("sdpi-select[setting='mode']")?.addEventListener("valuechange", (event) => {
			applyModeHint(event.target.value);
		});

		streamDeckClient.didReceiveSettings.subscribe((event) => {
			const settings = event.payload?.settings || {};
			applySourceVisibility(settings.sourceType || "file");
			applyModeHint(settings.mode || "play_stop");
		});

		streamDeckClient.getSettings().then((response) => {
			const settings = response?.settings || {};
			applySourceVisibility(settings.sourceType || "file");
			applyModeHint(settings.mode || "play_stop");
		});
	</script>
</body>

</html>
